<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Proyecto</title>
  <link rel="stylesheet" href="../css/style-new-project.css">
</head>
<body>
    <h2>Agregar Nueva Actividad</h2>
    <form id="projectForm">
      <label for="name">Nombre de la Actividad:</label>
      <input type="text" id="name" required><br>
  
      <label for="status">Estado:</label>
      <select id="status" required>
        <option value="" disabled selected>Seleccione un estado</option>
        <option value="Por hacer">Por hacer</option>
        <option value="En proceso">En proceso</option>
        <option value="Terminado">Terminado</option>
      </select><br><br>
  
      <label for="cost">Costo:</label>
      <input type="number" id="cost" required><br>
  
      <label for="startDate">Fecha de Inicio:</label>
      <input type="date" id="startDate" required><br><br>
  
      <label for="endDate">Fecha Final:</label>
      <input type="date" id="endDate" required><br><br>
  
      <label for="responsibleId">ID del Responsable:</label>
      <input type="text" id="responsibleId" required><br><br>
  
      <label for="projectId">ID del Proyecto:</label>
      <input type="text" id="projectId" required><br><br>
  
      <!-- Botones alineados -->
      <div class="button-group">
        <button type="button" id="closeBtn">Cerrar</button>
        <button type="submit">Guardar Actividad</button>
      </div>
    </form>
</body>
</html>
